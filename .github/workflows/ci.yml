name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Single-file build
        run: npm run build
      - name: Browser tests and user-journey flows
        # The flow-*.e2e.cjs files drive whole journeys (new kit, furniture in
        # 2D/3D, lights, make and export, build, save/share) and check the
        # screen answers each step. three.js comes from npm, not the CDN, so a
        # CDN hiccup can't fail a merge (the app still checks its SRI hash).
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/three" && (cd "$RUNNER_TEMP/three" && npm pack --silent three@0.128.0 && tar xzf three-0.128.0.tgz)
          export MIMI_THREE_JS="$RUNNER_TEMP/three/package/build/three.min.js"
          echo "MIMI_THREE_JS=$MIMI_THREE_JS" >> "$GITHUB_ENV" # for the test-first rerun below too
          npm run test:e2e
      - name: Tests before code
        # The branch's new or changed tests must fail on main and pass here.
        run: |
          git fetch --quiet origin main
          node scripts/check-test-first.js origin/main
