name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Assemble site
        run: |
          mkdir -p _site
          # Publish the app as one self-contained page so a browser can never
          # mix cached modules from an older deploy with newer ones.
          node scripts/build-single.js _site/index.html
          cp _site/index.html _site/mimimaker.html
          cp -r docs _site/
          # Community gallery: kits/*.kit.json rendered to a static page.
          node gallery/build.js _site/gallery
          echo "${GITHUB_SHA}" > _site/version.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
