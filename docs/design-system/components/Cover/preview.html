<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>
body { margin: 0; background: var(--paper); }
.cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
.cv svg { position: absolute; inset: 0; }
.ink { fill: var(--ink); } .mat { fill: var(--mat); } .kraft { fill: var(--kraft); } .glow { fill: var(--glow); } .bass { fill: var(--basswood); }
.name { position: absolute; left: 48px; bottom: 74px; max-width: 440px; margin: 0; font: 800 80px/.92 var(--font-display); letter-spacing: -.035em; color: var(--ink); }
.tag { position: absolute; left: 50px; bottom: 44px; max-width: 440px; margin: 0; font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
</style></head>
<body>
<div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: ink 32×300, kraft 448×110 (+fingers), mat 448×150 (+fingers), glow disc r=32 (space-6), basswood band 144×32
     arrangement: a tall ink slab at x=480, then a kraft board above a mat board, joined by a finger joint; glow disc as a lit window; basswood strip bleeding off the top
     pattern: literal motif, the finger joint itself (the README: "the finger joint is our signature"), fingers at the space-7 pitch (48px), 24px deep
     steps: space-7 48 (finger pitch), space-5 24 (finger depth), space-6 32 (ink slab, disc radius); radii: radius-lg 16 on the glow block corner -->
<rect class="ink" x="480" y="0" width="32" height="300"/>
<rect class="bass" x="560" y="0" width="144" height="32"/>
<rect class="kraft" x="512" y="40" width="448" height="110"/>
<rect class="mat" x="512" y="150" width="448" height="150"/>
<rect class="mat" x="512" y="126" width="48" height="24"/><rect class="kraft" x="560" y="150" width="48" height="24"/><rect class="mat" x="608" y="126" width="48" height="24"/><rect class="kraft" x="656" y="150" width="48" height="24"/><rect class="mat" x="704" y="126" width="48" height="24"/><rect class="kraft" x="752" y="150" width="48" height="24"/><rect class="mat" x="800" y="126" width="48" height="24"/><rect class="kraft" x="848" y="150" width="48" height="24"/><rect class="mat" x="896" y="126" width="48" height="24"/><rect class="kraft" x="944" y="150" width="48" height="24"/>
<circle class="glow" cx="880" cy="92" r="32"/>
</svg>
<h1 class="name">mimimaker</h1>
<p class="tag">Design it, cut it, light it, build it.</p>
</div>
</body>
</html>
