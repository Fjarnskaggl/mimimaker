<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:16px;background:var(--paper);}</style></head>
<body class="mm">
<div style="display:grid;gap:10px;max-width:560px">
  <div class="mm-notice"><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.5v.01"/></svg><div><b>Tip.</b> Drag pieces on the floor plan; hold Alt to place them off the grid.</div></div>
  <div class="mm-notice mm-notice--success"><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M6.5 10.2 9 12.5l4.5-5"/></svg><div><b>Calibrated.</b> Every joint now fits 2.10 mm board.</div></div>
  <div class="mm-notice mm-notice--warning"><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 18 16.5H2z"/><path d="M10 8v4M10 14.5v.01"/></svg><div><b>Thin fingers.</b> Shelf tabs are 2.6 mm wide; the Knife Blade is cleaner above 3 mm.</div><button class="mm-btn mm-btn--sm mm-btn--quiet act">Widen</button></div>
  <div class="mm-notice mm-notice--danger"><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 18 16.5H2z"/><path d="M10 8v4M10 14.5v.01"/></svg><div><b>Too big for the mat.</b> Back wall is 318 mm; the Maker cuts up to 292 mm.</div><button class="mm-btn mm-btn--sm mm-btn--quiet act">Use 12×24 mat</button></div>
</div>
</body>
</html>
