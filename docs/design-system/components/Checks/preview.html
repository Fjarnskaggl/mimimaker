<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:16px;background:var(--paper);}</style></head>
<body class="mm">
<div style="display:grid;gap:12px;justify-items:start">
  <div style="display:flex;gap:10px"><button class="mm-checks"><span class="dot"></span>All good</button><button class="mm-checks" data-state="warning"><span class="dot"></span>2 to check</button></div>
  <div class="mm-popover" role="dialog" aria-label="Checks">
    <div class="item danger"><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 18 16.5H2z"/><path d="M10 8v4M10 14.5v.01"/></svg><div><b>Display shelving overlaps the counter</b><small>Move one of them on the floor plan.</small></div></div>
    <div class="item warning"><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 18 16.5H2z"/><path d="M10 8v4M10 14.5v.01"/></svg><div><b>Shelf tabs are 2.6 mm wide</b><small>Cleaner cuts above 3 mm. Widen the shelf or use thinner board.</small></div></div>
  </div>
</div>
</body>
</html>
