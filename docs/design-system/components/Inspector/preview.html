<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:16px;background:var(--paper);}</style></head>
<body class="mm">
<aside class="mm-inspector" aria-label="Inspector">
  <header><span class="kicker">Piece</span><h3>Shop counter</h3><span class="meta">180 × 60 × 100 cm · 4 panels</span></header>
  <section><h4>Size and shape</h4>
    <div class="mm-row" style="--cols:3">
      <label class="mm-field"><span>Width</span><div class="mm-input"><input value="180"><span class="unit">cm</span></div></label>
      <label class="mm-field"><span>Depth</span><div class="mm-input"><input value="60"><span class="unit">cm</span></div></label>
      <label class="mm-field"><span>Height</span><div class="mm-input"><input value="100"><span class="unit">cm</span></div></label>
    </div>
    <label class="mm-field"><span>Front panels</span><div class="mm-input"><input value="4"></div></label>
  </section>
  <section><h4>Material</h4>
    <label class="mm-field"><div class="mm-input"><span class="mm-swatch mm-swatch--kraft" style="margin-left:12px"></span><select><option>Chipboard 1.5 mm</option></select></div><span class="hint">Knife Blade · about 38 min to cut</span></label>
  </section>
  <section><details><summary><svg class="mm-ic" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7M14 6h3M3 14h3M10 14h7"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="14" r="2"/></svg>Advanced</summary><div class="mm-row"><label class="mm-field"><span>Finger width</span><div class="mm-input"><input value="auto"><span class="unit">mm</span></div></label></div></details></section>
  <section class="actions"><button class="mm-btn mm-btn--sm">Duplicate</button><button class="mm-btn mm-btn--sm">Rotate</button><span style="flex:1"></span><button class="mm-btn mm-btn--sm mm-btn--danger">Remove</button></section>
</aside>
</body>
</html>
